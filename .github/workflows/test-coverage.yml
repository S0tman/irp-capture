name: Test coverage graphic

# Regenerates assets/test-coverage.svg (tests per module, counted from the live
# suite) on every push to main and commits it, so the README figure stays true.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (dev extras for pytest collection)
        run: pip install -e ".[dev]"

      - name: Render coverage graphic
        run: python tools/render_test_coverage_svg.py

      - name: Commit graphic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/test-coverage.svg
          if git diff --cached --quiet; then
            echo "no coverage change"
          else
            git commit -m "chore: refresh test coverage graphic [skip ci]"
            git push
          fi
